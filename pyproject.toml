[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenants2fast-fastapi"
dynamic = ["version"]
description = "Multi-tenancy management module for FastAPI with tenant isolation and permission-aware middleware"
readme = "README.md"
requires-python = ">=3.14"
license = {file = "LICENSE"}
authors = [
    {name = "Angel Daniel Sanchez Castillo", email = "angeldaniel.sanchezcastillo@gmail.com"}
]
keywords = ["fastapi", "multitenancy", "tenants", "sqlmodel", "middleware", "rbac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Pulls in pgsqlasync2fast-fastapi, mailing2fast-fastapi,
    # log2fast-fastapi, sqlmodel, fastapi, pydantic, etc. transitively.
    # 0.12.0+ ships UUID v7 + soft-delete on all permission tables.
    "permissions2fast-fastapi>=0.14.0",
    # Direct imports of User/token utilities and AuthError.
    # 0.8.0+ ships UUID v7 + soft-delete on users and refresh_tokens.
    "oauth2fast-fastapi>=0.8.2",
    # 0.4.0+ ships UUIDIdMixin, SoftDeleteMixin, and soft-delete helpers.
    "tools2fast-fastapi>=0.4.0",
    # 0.6.2+ ships the correct two-phase Alembic UUID helpers.
    "pgsqlasync2fast-fastapi>=0.9.0",
    # Alembic ships the shared migration runner/env/registry.
    "alembic>=1.20.0",
]

[dependency-groups]
dev = [
    "black",
    "ruff",
    "mypy>=1.0.0",
    "pre-commit",
    "build",
    "twine",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "aiosqlite",
]

[project.urls]
Homepage = "https://github.com/AngelDanielSanchezCastillo/tenants2fast-fastapi"
Documentation = "https://github.com/AngelDanielSanchezCastillo/tenants2fast-fastapi/tree/main/docs"
Repository = "https://github.com/AngelDanielSanchezCastillo/tenants2fast-fastapi"
Issues = "https://github.com/AngelDanielSanchezCastillo/tenants2fast-fastapi/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tenant2fast_fastapi*"]

[tool.setuptools.package-data]
tenant2fast_fastapi = [
    "seeders/manifest.json",
    "seeders/boot/*.json",
    "skills/*.md",
    # Package-owned Alembic chains (alembic-2fast): shipped in the wheel and
    # resolved from the installed release, never a checkout.
    "migrations/**/*.py",
]

# Single source of truth for the version: __version__.py
[tool.setuptools.dynamic]
version = {attr = "tenant2fast_fastapi.__version__.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

